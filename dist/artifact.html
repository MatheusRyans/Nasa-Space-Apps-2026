<meta charset="utf-8">
<title>AIneedHealth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* AIneedHealth: holographic operations console.
   Deep teal-navy ground, fine grid, translucent glass panels with corner brackets, cyan projection light.
   Status colors (green, yellow, orange, red) keep one meaning only and are never used as decoration.
   Every animation lives under html[data-fx="on"] and stops with the effects switch or reduced motion. */
:root {
  color-scheme: dark;
  --bg: #050d15;
  --surface: rgba(9, 28, 41, .68);
  --surface-2: rgba(16, 44, 62, .78);
  --solid: #0a1d2b;
  --line: rgba(111, 224, 238, .18);
  --line-2: rgba(111, 224, 238, .36);
  --fg: #d9eff6;
  --muted: #9dbdc9;
  --dim: #7a9dab;
  --accent: #6fe0ee;
  --accent-ink: #031219;
  --accent-weak: rgba(111, 224, 238, .16);
  --lv0: #52d49b;
  --lv1: #ecca4a;
  --lv2: #f79a3a;
  --lv3: #ff5d52;
  --lv0-bg: rgba(82, 212, 155, .12);
  --lv1-bg: rgba(236, 202, 74, .12);
  --lv2-bg: rgba(247, 154, 58, .14);
  --lv3-bg: rgba(255, 93, 82, .16);
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --t-xs: .75rem; --t-sm: .8125rem; --t-base: .9375rem; --t-md: 1.0625rem; --t-lg: 1.25rem; --t-xl: 1.5rem; --t-2xl: 1.875rem;
  --r: 4px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --beat: 1s;
  --breath: 4s;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; font: 400 var(--t-base)/1.5 var(--font); color: var(--fg);
  background:
    radial-gradient(1100px 600px at 88% -12%, rgba(40, 150, 175, .22), transparent 62%),
    radial-gradient(900px 520px at -8% 108%, rgba(20, 90, 130, .20), transparent 60%),
    var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  min-height: 100vh;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: linear-gradient(rgba(111, 224, 238, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(111, 224, 238, .06) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 28%, #000 25%, transparent 88%);
  mask-image: radial-gradient(ellipse at 50% 28%, #000 25%, transparent 88%);
}
#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
::selection { background: var(--accent-weak); color: #fff; }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
a { color: var(--accent); text-underline-offset: 3px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
input, select { accent-color: var(--accent); caret-color: var(--accent); }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.lv0 { --c: var(--lv0); --cb: var(--lv0-bg); } .lv1 { --c: var(--lv1); --cb: var(--lv1-bg); }
.lv2 { --c: var(--lv2); --cb: var(--lv2-bg); } .lv3 { --c: var(--lv3); --cb: var(--lv3-bg); }

.wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding-block: 12px 40px; }

/* ---------- HUD panel ---------- */
.hud { position: relative; background: var(--surface); border: 1px solid var(--line); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.hud::before, .hud::after { content: ''; position: absolute; width: 16px; height: 16px; border: 2px solid var(--accent); pointer-events: none; opacity: .85; }
.hud::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.hud::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.hud-title { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 4px 22px 4px 12px; background: linear-gradient(90deg, rgba(111, 224, 238, .28), rgba(111, 224, 238, .10)); clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); font-size: var(--t-xs); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--fg); }
.hud-title i { width: 4px; align-self: stretch; background: var(--accent); }

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 4px 0 12px; border-bottom: 1px solid var(--line-2); margin-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { flex: none; }
.brand b { font-size: var(--t-lg); font-weight: 600; letter-spacing: .01em; }
.brand span { display: block; font-size: var(--t-sm); color: var(--muted); line-height: 1.2; }
.badge-sim { border: 1px solid var(--lv1); color: var(--lv1); background: var(--lv1-bg); padding: 2px 10px; border-radius: 999px; font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
.ctl { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); color: var(--muted); }
.ctl select { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 5px 28px 5px 10px; min-height: 34px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg button { background: var(--surface-2); border: 0; padding: 5px 12px; min-height: 34px; font-size: var(--t-sm); font-weight: 500; color: var(--muted); transition: background .18s var(--ease), color .18s var(--ease); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--accent-weak); color: var(--fg); }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; font-weight: 500; color: var(--muted); white-space: nowrap; margin-bottom: -1px; letter-spacing: .02em; transition: color .18s var(--ease), border-color .18s var(--ease); }
nav.tabs button:hover { color: var(--fg); }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

/* ---------- demo drawer ---------- */
details.demo { border: 1px dashed var(--line-2); border-radius: var(--r); margin-bottom: 14px; background: rgba(9, 28, 41, .5); }
details.demo > summary { padding: 8px 12px; cursor: pointer; font-size: var(--t-sm); font-weight: 600; color: var(--accent); list-style: none; }
details.demo > summary::-webkit-details-marker { display: none; }
details.demo > summary::before { content: '+'; display: inline-block; width: 1.1em; }
details.demo[open] > summary::before { content: '–'; }
.demo-body { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; padding: 0 12px 12px; }
.demo-body p { flex-basis: 100%; margin: 0; font-size: var(--t-sm); color: var(--muted); }
.demo-body .grp { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.demo-body label { display: grid; gap: 4px; font-size: var(--t-xs); color: var(--muted); }

/* ---------- buttons ---------- */
.btn { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 6px 14px; min-height: 36px; font-weight: 500; transition: background .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease); }
.btn:hover { border-color: var(--accent); background: var(--accent-weak); box-shadow: 0 0 14px rgba(111, 224, 238, .25); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); background: var(--surface-2); box-shadow: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: #9aeef7; border-color: #9aeef7; }
.btn.danger { border-color: var(--lv3); color: var(--lv3); }
.btn.danger:hover { background: var(--lv3-bg); box-shadow: 0 0 14px rgba(255, 93, 82, .3); }

/* ---------- status pill ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px 1px 7px; border: 1px solid var(--c); color: var(--c); background: var(--cb); border-radius: 999px; font-size: var(--t-xs); font-weight: 600; letter-spacing: .03em; white-space: nowrap; line-height: 1.7; }
.pill svg { width: 14px; height: 14px; flex: none; }

/* ---------- alert banner ---------- */
#alertbar { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--c); background: var(--cb); border-radius: var(--r); margin-bottom: 14px; }
#alertbar strong { color: var(--c); font-weight: 600; }
#alertbar .btn { margin-left: auto; border-color: var(--c); }

/* ---------- layout ---------- */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 28px; align-items: start; }
section.pane { min-width: 0; }
.grid .map-pane { order: 1; }
.grid .state-pane { order: 2; }
section.pane > h2 { margin: 0 0 4px; font-size: var(--t-md); font-weight: 600; }
.sub { margin: 0 0 12px; color: var(--muted); font-size: var(--t-sm); }
.sep { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 18px; }

/* ---------- live telemetry ---------- */
.tele { display: grid; grid-template-columns: minmax(0, 2.2fr) repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
.tele .card { padding: 14px 16px 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tele .card .hud-title { justify-self: start; margin: -14px 0 4px -16px; }
.tele .big { font-size: var(--t-2xl); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; color: var(--c, var(--fg)); text-shadow: 0 0 14px color-mix(in srgb, var(--c, var(--accent)) 55%, transparent); }
.tele .big small { font-size: var(--t-sm); font-weight: 500; color: var(--muted); margin-left: 4px; text-shadow: none; }
.tele .st { font-size: var(--t-xs); font-weight: 600; letter-spacing: .1em; color: var(--accent); }
.tele .st.off { color: var(--dim); }
.tele canvas { display: block; width: 100%; height: 86px; }
.tele .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.tele .note { margin: 0; font-size: var(--t-xs); color: var(--dim); }
.gauge { height: 6px; background: rgba(111, 224, 238, .12); border-radius: 3px; overflow: hidden; }
.gauge i { display: block; height: 100%; background: var(--c, var(--accent)); box-shadow: 0 0 10px var(--c, var(--accent)); transform-origin: left; }
.breath { height: 6px; background: var(--accent); border-radius: 3px; box-shadow: 0 0 10px var(--accent); transform-origin: left; transform: scaleX(.7); }

/* ---------- state hero ---------- */
.hero { position: relative; padding: 16px 18px; border: 1px solid var(--c); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 16%, transparent), color-mix(in srgb, var(--c) 6%, transparent)); border-radius: var(--r); display: grid; gap: 8px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.hero .lvl { display: flex; align-items: center; gap: 12px; font-size: var(--t-2xl); font-weight: 600; letter-spacing: -.01em; color: var(--c); line-height: 1.1; text-shadow: 0 0 16px color-mix(in srgb, var(--c) 50%, transparent); }
.hero .lvl svg { width: 34px; height: 34px; flex: none; filter: drop-shadow(0 0 6px var(--c)); }
.hero .msg { font-size: var(--t-md); max-width: 62ch; }
.hero .act { font-weight: 600; }
.hero .meta { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: var(--t-sm); color: var(--muted); }
.note { font-size: var(--t-sm); color: var(--muted); max-width: 70ch; margin: 10px 0 0; }
.note.pending { color: var(--fg); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }

/* questions */
.q { border-top: 1px solid var(--line); }
.q > summary { cursor: pointer; padding: 12px 0; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.q > summary::-webkit-details-marker { display: none; }
.q > summary::after { content: '+'; color: var(--accent); font-weight: 400; }
.q[open] > summary::after { content: '–'; }
.q .body { padding: 0 0 14px; max-width: 70ch; }
.q ul { margin: 0; padding-left: 20px; }
.q li { margin: 3px 0; }
.q p { margin: 0 0 6px; }
.urg { display: inline-block; margin-top: 8px; padding: 1px 10px; border: 1px solid var(--c); color: var(--c); background: var(--cb); border-radius: var(--r); font-size: var(--t-sm); font-weight: 600; }
.disc { font-size: var(--t-sm); color: var(--muted); margin-top: 8px; }
.hz { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: var(--t-xs); color: var(--muted); align-items: center; }
.tag { display: inline-block; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 3px; font-size: var(--t-xs); color: var(--muted); }
.tag.nasa { border-color: var(--accent); color: var(--accent); }

/* tables */
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: var(--t-xs); font-weight: 600; color: var(--dim); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-2); white-space: nowrap; letter-spacing: .04em; }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); font-size: var(--t-sm); white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: rgba(111, 224, 238, .06); }
tr.pick.on td { background: var(--accent-weak); }
tr.pick:focus-visible { outline-offset: -2px; }
td.name { white-space: normal; min-width: 150px; }

/* ---------- hologram stage ---------- */
.stage { position: relative; padding: 0 0 12px; overflow: hidden; }
.stage .hud-title { position: relative; z-index: 3; margin-bottom: 4px; }
.stage .hint { margin: 6px 16px 0; font-size: var(--t-sm); color: var(--muted); position: relative; z-index: 3; }
.holo { position: relative; max-width: 480px; margin: 0 auto; }
.holo canvas.dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.holo::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2; background: repeating-linear-gradient(0deg, rgba(111, 224, 238, .05) 0 1px, transparent 1px 4px); mix-blend-mode: screen; }
.map { display: block; width: 100%; height: auto; position: relative; z-index: 1; overflow: visible; }
.reg { cursor: pointer; }
.reg .shape { fill: color-mix(in srgb, var(--c) 13%, transparent); stroke: var(--c); stroke-width: 1.6; transition: fill .5s var(--ease), stroke .5s var(--ease); filter: drop-shadow(0 0 5px color-mix(in srgb, var(--c) 70%, transparent)); }
.reg .slice { fill: none; stroke: var(--c); stroke-width: 1; opacity: .35; pointer-events: none; }
.reg:hover .shape { fill: color-mix(in srgb, var(--c) 26%, transparent); }
.reg.sel .shape { stroke-width: 3; fill: color-mix(in srgb, var(--c) 24%, transparent); }
.part { fill: rgba(111, 224, 238, .05); stroke: var(--line-2); stroke-width: 1.2; stroke-dasharray: 3 3; }
.pin rect { fill: rgba(5, 16, 25, .82); stroke: var(--line-2); }
.pin.sel rect { stroke: var(--accent); stroke-width: 2; }
.pin { cursor: pointer; }
.pin .pn { font-size: 11px; fill: var(--muted); font-weight: 600; letter-spacing: .08em; }
.pin .ps { font-size: 12px; font-weight: 600; fill: var(--c); }
.link { stroke: var(--line-2); stroke-width: 1.2; fill: none; stroke-dasharray: 2 3; }
.node { fill: var(--accent); }
.emit { fill: none; stroke: var(--accent); stroke-width: 1.4; opacity: .55; }
.ring { fill: none; stroke: var(--accent); stroke-width: 1.4; opacity: 0; }
.beam { fill: url(#beamg); opacity: .5; }
.sweep { opacity: 0; }
.heart { fill: none; stroke: var(--c); stroke-width: 2; opacity: 0; }
.stage.scan::after { content: ''; position: absolute; left: 0; right: 0; height: 90px; top: 0; z-index: 4; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(111, 224, 238, .38), transparent); animation: scanin 1.3s var(--ease) both; }
.whole { display: flex; justify-content: center; margin: 0 0 6px; position: relative; z-index: 3; }
.whole button { display: flex; gap: 10px; align-items: center; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 6px 14px; min-height: 36px; }
.whole button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); }
.region { padding-top: 18px; }
.region h3 { margin: 0 0 4px; font-size: var(--t-md); font-weight: 600; }
.irow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 96px; gap: 4px 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.irow .nm { font-weight: 500; display: grid; gap: 4px; justify-items: start; }
.irow .v { font-size: var(--t-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.irow .v b { color: var(--fg); font-weight: 500; }
.irow details { grid-column: 1 / -1; }
.irow summary { cursor: pointer; font-size: var(--t-sm); color: var(--muted); }
.irow details p { margin: 6px 0 2px; font-size: var(--t-sm); color: var(--muted); max-width: 70ch; }
svg.sp { display: block; }
.sp-band { fill: rgba(111, 224, 238, .14); } .sp-line { fill: none; stroke: var(--c, var(--muted)); stroke-width: 1.5; filter: drop-shadow(0 0 3px var(--c, transparent)); } .sp-dot { fill: var(--c); }

/* ---------- charts ---------- */
.chartbox { margin-bottom: 18px; }
.chartbox h3 { margin: 0 0 2px; font-size: var(--t-md); font-weight: 600; }
.ax { fill: var(--dim); font-size: 10.5px; }
.gridl { stroke: var(--line); stroke-width: 1; }
.band { fill: rgba(111, 224, 238, .13); }
.ln { fill: none; stroke: var(--fg); stroke-width: 1.8; stroke-linejoin: round; filter: drop-shadow(0 0 4px rgba(111, 224, 238, .6)); }
.draw { stroke-dasharray: 1; stroke-dashoffset: 0; }

/* ---------- forms ---------- */
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px 20px; }
.form fieldset { grid-column: 1 / -1; border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px 20px; }
.form legend { padding: 0; margin: 0 0 8px; font-weight: 600; font-size: var(--t-md); grid-column: 1 / -1; }
.field { display: grid; gap: 4px; align-content: start; }
.field label { font-weight: 500; font-size: var(--t-sm); }
.field .inp { display: flex; align-items: center; gap: 8px; }
.field input, .field select { width: 100%; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 7px 10px; min-height: 40px; transition: border-color .18s var(--ease), box-shadow .18s var(--ease); }
.field input:hover, .field select:hover { border-color: var(--dim); }
.field input:focus, .field select:focus { box-shadow: 0 0 0 3px var(--accent-weak); }
.field input[aria-invalid="true"] { border-color: var(--lv3); }
.field .u { color: var(--muted); font-size: var(--t-sm); min-width: 3.2em; }
.field .help { font-size: var(--t-xs); color: var(--dim); }
.field .err { font-size: var(--t-xs); color: var(--lv3); min-height: 1em; }
.formfoot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.streak { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; padding: 12px 0; }
.streak .big { font-size: var(--t-xl); font-weight: 600; font-variant-numeric: tabular-nums; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badges .tag { color: var(--fg); border-color: var(--lv0); }
.result { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); border-radius: var(--r); display: grid; gap: 6px; }
.op { display: grid; gap: 8px; justify-items: start; }

/* ---------- emergency ---------- */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 12px 0; }
.step { border: 1px solid var(--line-2); border-radius: var(--r); padding: 6px 10px; font-size: var(--t-xs); color: var(--dim); }
.step b { display: block; font-weight: 600; color: var(--muted); }
.step.on { border-color: var(--lv1); color: var(--fg); box-shadow: 0 0 12px rgba(236, 202, 74, .3); } .step.on b { color: var(--lv1); }
.step.done { border-color: var(--lv0); } .step.done b { color: var(--lv0); }
.step.crit { border-color: var(--lv3); background: var(--lv3-bg); color: var(--fg); box-shadow: 0 0 14px rgba(255, 93, 82, .4); } .step.crit b { color: var(--lv3); }
.confirm { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.timer { position: relative; width: 112px; height: 112px; flex: none; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 6; }
.timer .tr { stroke: rgba(236, 202, 74, .18); }

<script>
/* AIneedHealth engine: pure functions, no DOM, no network.
   Two independent routes feed one state (requirements doc, section 3):
   route A = trend against the individual baseline (persistence + hysteresis),
   route B = absolute safety limits (immediate, confirmed by 2 consecutive readings).
   Every number below is a parameter of the Medical Profile, set by the flight medical team. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* Levels: 0 good, 1 alert, 2 attention, 3 critical emergency */
  const LEVEL_KEYS = ['good', 'alert', 'attention', 'emergency'];

  /* dir = direction of risk; kind: num (deviation in sigma) | ord (deviation in points) */
  const INDICATORS = [
    { k: 'fc', dir: 'up', kind: 'num', dec: 0, unit: 'bpm', region: 'chest', min: 30, max: 200, step: 1, hz: ['gravity', 'isolation'] },
    { k: 'spo2', dir: 'down', kind: 'num', dec: 0, unit: '%', region: 'chest', min: 70, max: 100, step: 1, hz: ['closedEnv'] },
    { k: 'fr', dir: 'both', kind: 'num', dec: 0, unit: 'rpm', region: 'chest', min: 4, max: 40, step: 1, hz: ['closedEnv', 'gravity'] },
    { k: 'pa', dir: 'both', kind: 'num', dec: 0, unit: 'mmHg', region: 'chest', min: 60, max: 220, step: 1, hz: ['gravity'] },
    { k: 'sym_tosse', dir: 'up', kind: 'ord', dec: 1, unit: '/3', region: 'chest', min: 0, max: 3, step: 1, hz: ['closedEnv'] },
    { k: 'sono', dir: 'down', kind: 'num', dec: 1, unit: 'h', region: 'head', min: 0, max: 14, step: 0.1, hz: ['isolation', 'closedEnv'] },
    { k: 'humor', dir: 'down', kind: 'ord', dec: 1, unit: '/5', region: 'head', min: 1, max: 5, step: 1, hz: ['isolation', 'distance'] },
    { k: 'sym_olho', dir: 'up', kind: 'ord', dec: 1, unit: '/3', region: 'head', min: 0, max: 3, step: 1, hz: ['closedEnv'] },
    { k: 'temp', dir: 'up', kind: 'num', dec: 1, unit: '°C', region: 'arms', min: 34, max: 42, step: 0.1, hz: ['gravity', 'closedEnv'] },
    { k: 'sym_pele', dir: 'up', kind: 'ord', dec: 1, unit: '/3', region: 'arms', min: 0, max: 3, step: 1, hz: ['closedEnv'] },
    { k: 'gli', dir: 'both', kind: 'num', dec: 0, unit: 'mg/dL', region: 'general', min: 30, max: 500, step: 1, hz: [] }
  ];
  const IK = Object.fromEntries(INDICATORS.map(i => [i.k, i]));

  /* Route B: absolute limits [limit 1 -> attention, limit 2 -> critical emergency] */
  const LIMITS = {
    temp: { high: [38.4, 39.5], hiOp: 'ge' },
    spo2: { low: [90, 85] },
    fc: { high: [100, 130], hiOp: 'gt', low: [45, 35] },
    pa: { high: [160, 180], hiOp: 'ge', low: [90, 70] },
    gli: { high: [180, 300], hiOp: 'gt', low: [70, 54] }
  };

  /* Long-term capacity: requirements of NASA-STD-3001 Vol. 1 Rev C, shown as a separate seal */
  const CAPACITY = [
    { k: 'aer', ref: 'V1 4003', req: 80 },
    { k: 'force', ref: 'V1 4024', req: 80 },
    { k: 'bmd', ref: 'V1 4027', req: 95 },
    { k: 'dose', ref: 'V1 4030', max: 600 }
  ];

  const TOLERANCES = {
    alertSigma: 1, attnSigma: 2, enterDays: 3,
    exitAlertSigma: 0.7, exitAttnSigma: 1.5, exitDays: 2,
    ordAlertPts: 1, ordAttnPts: 2, ordExitAlertPts: 0.5, ordExitAttnPts: 1.5,
    evaWindowDays: 3, adaptationDays: 2, adaptFactor: 1.5, minDwellHours: 24
  };

  const BASE = {
    fc: [62, 3], spo2: [97, 1], fr: [14, 2], pa: [118, 6], sym_tosse: [0.3, 0.4],
    sono: [7.2, 0.5], humor: [4.0, 0.5], sym_olho: [0.3, 0.4], temp: [36.6, 0.2], sym_pele: [0.3, 0.4], gli: [92, 6]
  };
  /* small individual differences, deterministic */
  const INDIV = { 'A-01': { fc: -2 }, 'A-02': { fc: -4, sono: 0.2 }, 'A-03': { fc: 3, pa: 4 }, 'A-04': { fc: -1, gli: -3 } };

  function makeProfile(id) {
    const baseline = {};
    for (const i of INDICATORS) {
      const [m, sd] = BASE[i.k];
      baseline[i.k] = { mean: m + ((INDIV[id] || {})[i.k] || 0), sd };
    }
    return {
      version: 3, approvedBy: 'Flight surgeon (simulated)', approvedAt: '2026-10-02', env: 'station',
      baseline, limits: LIMITS, tolerances: Object.assign({}, TOLERANCES),
      capacity: { aer: 93, force: 97, bmd: 98, dose: 42 }
    };
  }

  /* ---------- deterministic noise for the simulated history ---------- */
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };

  function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

  /* drift targets: sigma for num indicators, points for ord indicators, in the risk direction */
  const SCENARIOS = {
    healthy: { drift: {}, start: 0 },
    trend: { drift: { fc: 1.6, sono: 1.6, humor: 1.4 }, start: 12 },
    high: { drift: { fc: 2.8, sono: 2.8, humor: 2.6, pa: 1.6 }, start: 10 },
    dust: { drift: { sym_olho: 1.4, sym_tosse: 1.4, sym_pele: 1.4 }, step: 27, eva: 27 },
    acute: { drift: {}, start: 0, lastTemp: 38.9 }
  };

  /* history of days 1..29; day 30 is today and its check-in is still pending */
  function makeHistory(id, scenario, profile) {
    const S = SCENARIOS[scenario] || SCENARIOS.healthy;
    const readings = [];
    const rs = {};
    for (const i of INDICATORS) rs[i.k] = rng(hash(id + i.k));
    for (let d = 1; d <= 29; d++) {
      const v = {};
      for (const i of INDICATORS) {
        const b = profile.baseline[i.k];
        const zt = S.drift[i.k] || 0;
        let ramp = 0;
        if (zt) ramp = S.step != null ? (d >= S.step ? 1 : 0) : Math.max(0, Math.min(1, (d - 1 - S.start) / (24 - S.start)));
        const sign = i.dir === 'down' ? -1 : 1;
        const noise = (rs[i.k]() * 2 - 1);

  function irow(I, rec) {

  /* ---------- overview ---------- */
  function simPanel(rec) {
    const sim = S.sim;

    const live = '<div class="meters">' + meter(t('sim.hr'), 'hr', last.hr == null ? '—' : Math.round(last.hr), 'bpm', last.hr == null ? 0 : (last.hr - 20) / 100, '<em>' + esc(t('sim.limit', { n: lim })) + '</em>') + meter(t('sim.motion'), 'mo', Math.round(last.motion || 0), '', (last.motion || 0) / 60) + meter(t('sim.quality'), 'q', Math.round((last.q || 0) * 100), '%', last.q || 0) + '</div><p class="detstate" id="sl-state">' + esc(t('sim.state.' + st)) + '</p>';

  /* ---------- medical team view: investigate and validate ---------- */

  /* ---------- simulation of the incapacitation stream ---------- */
  function stopSim() { if (S.sim) { clearInterval(S.sim.timer); clearInterval(S.sim.cdTimer); S.sim = null; } S.recs.forEach(r => { r.sleeping = false; }); }
  function startSim(mode) {
    stopSim();
    const rec = cur(); rec.em = null; rec.loss = false;
    const r = E.rng(7);
    const sim = S.sim = { mode, who: rec.i, t: 0, buf: [], det: { state: 'ok' }, r, timer: null, cdTimer: null, holdSuspect: 0, hr: null, lastDet: 'ok' };
    for (let k = 0; k < 20; k++) { const s = E.simulateSample(mode, sim.t++, r); sim.buf.push(s); if (s.hr != null) sim.hr = s.hr; }
    rec.sleeping = mode === 'sleep';
    sim.det = E.detectIncapacitation(sim.buf, { limits: rec.profile.limits, sleeping: rec.sleeping });
    sim.lastDet = sim.det.state;
    sim.timer = setInterval(tick, 100);
    S.tab = home(); S.scanNext = true; S.fresh = true; S.anim = true; S.demoOpen = false;
    recompute(rec); renderDemo(); render(); window.scrollTo(0, 0);
    toast(t('toast.sim'), mode === 'faint' ? 1 : null);
  }
  function stopSimUser() {
    const sim = S.sim; if (!sim) return;
    const rec = S.recs[sim.who];
    stopSim();
    if (rec.em && rec.em.stage !== 'declared') rec.em = null;
    rec.loss = false; recompute(rec); render(); toast(t('toast.stop'));
  }
  function liveUpdate() {
    const sim = S.sim;
    if (!sim || sim.who !== S.user) return;
    const last = sim.buf[sim.buf.length - 1] || {};
    const set = (id, txt) => { const n = $('#' + id); if (n) n.textContent = txt; };
    const bar = (id, f) => { const n = $('#' + id); if (n) n.style.transform = 'scaleX(' + Math.max(0, Math.min(1, f)).toFixed(3) + ')'; };
    if (sim.hr != null) set('live-hr', Math.round(sim.hr));
    set('sl-hr', last.hr == null ? '—' : Math.round(last.hr)); bar('sl-hr-b', last.hr == null ? 0 : (last.hr - 20) / 100);
    set('sl-mo', Math.round(last.motion || 0)); bar('sl-mo-b', (last.motion || 0) / 60);
    set('sl-q', Math.round((last.q || 0) * 100)); bar('sl-q-b', last.q || 0);
    const st = $('#sl-state'); if (st) st.textContent = t('sim.state.' + sim.det.state);
  }
  function tick() {
    const sim = S.sim; if (!sim) return;
    const rec = S.recs[sim.who];
    const sample = E.simulateSample(sim.mode, sim.t++, sim.r);
    sim.buf.push(sample); if (sim.buf.length > 300) sim.buf.shift();
    if (sample.hr != null) sim.hr = sim.hr == null ? sample.hr : sim.hr + (sample.hr - sim.hr) * 0.25;
    sim.det = E.detectIncapacitation(sim.buf, { limits: rec.profile.limits, sleeping: rec.sleeping });
    let changed = false;
    const wasLoss = rec.loss;
    rec.loss = sim.det.state === 'sensor';
    if (rec.loss !== wasLoss) { addEv(rec.i, 0, rec.loss ? 'evt.sensor' : 'evt.sensorBack'); changed = true; }
    if (!rec.em && sim.det.state === 'suspect') {
      rec.em = { stage: 'suspect', cd: 8, buf: [], t0: S.clock, hrLast: sample.hr };
      addEv(rec.i, 1, 'evt.suspect');
      sim.holdSuspect = sim.t; changed = true;
    } else if (rec.em && rec.em.stage === 'suspect' && sim.t - sim.holdSuspect > 10) {
      rec.em.stage = 'confirm';
      sim.cdTimer = setInterval(countdown, 1000); changed = true;
    }
    if (rec.em && sample.hr != null) rec.em.hrLast = sample.hr;
    if (sim.det.state !== sim.lastDet) { sim.lastDet = sim.det.state; changed = true; }
    if (changed && S.user === rec.i) render(); else liveUpdate();
    if (sim.mode === 'faint' && !rec.em && sim.t > 130) clearInterval(sim.timer);
  }
  function countdown() {
    const sim = S.sim; if (!sim) return;
    const rec = S.recs[sim.who];
    if (!rec.em || rec.em.stage !== 'confirm') { clearInterval(sim.cdTimer); return; }
    rec.em.cd--;
    if (rec.em.cd <= 0) { clearInterval(sim.cdTimer); clearInterval(sim.timer); declare(rec); return; }
    const n = $('#cd-num'); if (n) n.textContent = rec.em.cd;
    const r = $('#cd-ring'); if (r) r.style.strokeDashoffset = (1 - rec.em.cd / 8).toFixed(3);
    renderBanner();
  }
  function declare(rec) {
    S.clock += 4;
    rec.em.stage = 'declared'; rec.em.t0 = S.clock; rec.em.buf = S.sim ? S.sim.buf.slice(-100) : [];
    addEv(rec.i, 3, 'evt.em', {}, true); addEv(rec.i, 3, 'evt.alert', {}, true);
    recompute(rec);
    if (S.role === 'astro') S.user = (rec.i + 1) % ROSTER.length; S.tab = home();
    render(); openAlert();
  }
  function ackSim() {
    const rec = cur(), sim = S.sim;
    if (!rec.em || rec.em.stage === 'declared') return;
    clearInterval(sim && sim.cdTimer);
    rec.em = null; addEv(rec.i, 0, 'evt.ok');
    if (sim) { clearInterval(sim.timer); S.sim = null; }
    recompute(rec); render(); toast(t('toast.ack'), 0);
  }

  /* ---------- actions ---------- */
  function submitCheckin() {
    const rec = cur(), v = Object.assign({}, S.form);
    S.errors = E.validate(v);
    const any = E.INDICATORS.some(i => v[i.k] !== '' && v[i.k] != null);
    if (!any) S.errors._empty = true;
    if (Object.keys(S.errors).length) { render(); const first = document.querySelector('[aria-invalid="true"]'); if (first) first.focus(); return; }
    const prev = snap(rec);
    E.addReading(rec, rec.today, v, rec.today * 1440 + (S.clock % 1440));
    rec.fresh = true;
    S.clock += 7;
    addEv(rec.i, 0, 'evt.checkin', { day: rec.today });
    recompute(rec); logChange(rec, prev);
    S.form = {}; S.errors = {}; S.result = { who: rec.i }; S.fresh = true; S.scanNext = true;
    render();
    const r = $('#ci-result'); if (r) r.focus();
    live(t('ci.saved') + ' ' + t('lv.' + rec.level));
  }
  function live(text) { const l = $('#live'); if (l) l.textContent = text; }
  let toastTimer = null;
  function toast(text, lv, ms) {
    const el = $('#toast'); if (!el) return;
    el.className = 'toast show' + (lv == null ? '' : ' lv' + lv);
    el.textContent = text;
    live(text);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast'; }, ms || 3600);
  }
  function loadScenario(sc) {
    const i = S.user;
    stopSim();
    const prevLevel = S.recs[i].level;
    const rec = mkRec(i, sc); S.recs[i] = rec;
    S.clock += 11; addEv(i, rec.level, 'evt.scenario', { scenario: sc });
    if (rec.level !== prevLevel) addEv(i, rec.level, 'evt.state', { from: prevLevel, to: rec.level });
    rec.res.pats.forEach(p => addEv(i, p.level, 'evt.pattern', { pattern: p.id, conf: p.conf }));
    Object.keys(rec.res.limits).forEach(k => addEv(i, 2, 'evt.limit', { ind: k }));
    S.result = null; S.form = {}; S.errors = {};
    S.tab = home(); S.anim = true; S.scanNext = true; S.fresh = true;
    closeAlert(); render(); window.scrollTo(0, 0);
    toast(t('toast.scenario', { scenario: t('demo.sc.' + sc) }) + ' · ' + t('lv.' + rec.level), rec.level);
  }
  function nextDay() {
    const rec = cur();
    if (rec.em && rec.em.stage === 'declared') return;
    rec.today++; rec.fresh = false; S.clock = rec.today * 1440 + 480;
    addEv(rec.i, 0, 'evt.day', { day: rec.today });
    S.result = null; S.tab = home(); S.scanNext = true; S.fresh = true; S.anim = true;
    recompute(rec); render(); window.scrollTo(0, 0);
    toast(t('toast.day', { day: rec.today }), 1);
  }
  function init() {
    stopSim();
    S.recs = ROSTER.map((r, i) => mkRec(i, r.scn));
    S.events = []; S.eid = 0; S.clock = 30 * 1440 + 480; S.user = 1; S.tab = home(); S.region = 'chest'; S.result = null; S.form = {}; S.errors = {}; S.gateMsg = null;
    S.recs.forEach(rec => { rec.res.pats.forEach(p => addEv(rec.i, p.level, 'evt.pattern', { pattern: p.id, conf: p.conf })); });
    closeAlert(); renderDemo(); render();
    if (FX.reduceSys && !S.noted) { S.noted = true; toast(t('toast.reduce'), null, 9000); }
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act;
    if (a === 'tab') { S.tab = el.dataset.tab; S.gateMsg = null; S.anim = true; if (location.hash !== '#' + S.tab) { try { history.replaceState(null, '', '#' + S.tab); } catch (x) { /* ignore */ } } render(); window.scrollTo(0, 0); }
    else if (a === 'region') { S.region = el.dataset.r; render(); }
    else if (a === 'role') { S.role = el.dataset.role; S.tab = home(); S.anim = true; S.scanNext = true; try { history.replaceState(null, '', '#' + S.tab); } catch (x) { /* ignore */ } render(); window.scrollTo(0, 0); }
    else if (a === 'crew') { stopSim(); S.user = +el.dataset.i; S.anim = true; S.scanNext = true; render(); }
    else if (a === 'ind') { S.ind = el.dataset.k; S.anim = true; render(); }
    else if (a === 'scn') loadScenario(el.dataset.sc);
    else if (a === 'nextday') nextDay();
    else if (a === 'reset') { init(); S.scanNext = true; S.fresh = true; S.anim = true; render(); window.scrollTo(0, 0); toast(t('toast.reset')); }
    else if (a === 'sim') startSim(el.dataset.mode);
    else if (a === 'ack') ackSim();
    else if (a === 'simstop') stopSimUser();
    else if (a === 'viewpatient') { const rec = S.recs.find(r => r.em && r.em.stage === 'declared'); if (rec) { S.user = rec.i; S.anim = true; S.scanNext = true; closeAlert(); render(); window.scrollTo(0, 0); } }
    else if (a === 'alertopen') openAlert();
    else if (a === 'alertclose') closeAlert();
    else if (a === 'endinc') { const rec = S.recs.find(r => r.em && r.em.stage === 'declared'); if (rec) { addEv(rec.i, 0, 'evt.end', {}, true); rec.em = null; stopSim(); recompute(rec); closeAlert(); render(); } }
    else if (a === 'evastart') { const rec = cur(); if (!rec.fresh) { S.gateMsg = true; render(); return; } rec.evaOn = true; rec.evaDay = rec.today; rec.fresh = false; S.gateMsg = null; addEv(rec.i, 0, 'evt.eva'); recompute(rec); render(); }
    else if (a === 'evaend') { const rec = cur(); rec.evaOn = false; addEv(rec.i, 0, 'evt.evaEnd'); render(); }
    else if (a === 'fx') { FX.set(!FX.enabled); render(); }
    else if (a === 'lang') { lang = el.dataset.lang; try { localStorage.setItem('ainh-lang', lang); } catch (x) { /* ignore */ } renderDemo(); render(); }
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-act][tabindex]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'viewas') { stopSim(); S.user = +el.value; S.anim = true; S.scanNext = true; S.result = null; S.form = {}; S.errors = {}; S.gateMsg = null; render(); }
    else if (el.dataset && el.dataset.bind) { S.form[el.dataset.bind] = el.value; }
    else if (el.id === 'indsel') { S.ind = el.value; render(); }
  });
  document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.bind) S.form[el.dataset.bind] = el.value; });
  document.addEventListener('submit', e => { if (e.target.id === 'ciform') { e.preventDefault(); submitCheckin(); } });
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (TABS.indexOf(h) >= 0 && h !== S.tab) { S.role = ROLE_TABS.med.indexOf(h) >= 0 ? 'med' : 'astro'; S.tab = h; render(); } });

  /* ---------- link the effects engine to the app state ---------- */
  const LVC = ['#6fe0ee', '#ecca4a', '#f79a3a', '#ff5d52'];
  function simHr(rec) {
    if (S.sim && S.sim.who === rec.i && S.sim.hr != null) return S.sim.hr;
    if (rec.em && rec.em.stage === 'declared' && rec.em.hrLast != null) return rec.em.hrLast;
    return null;
  }
  FX.fmt = fmt;
  FX.src.bpm = () => { const rec = cur(); if (!rec) return 62; const s = simHr(rec); if (s != null) return s; const f = rec.res.inds.fc.last; return f == null ? 62 : f; };
  FX.src.amp = () => { const b = FX.src.bpm(); return b < 40 ? 0.45 : 1; };
  FX.src.lost = () => { const rec = cur(); return !!(rec && (rec.loss || (S.sim && S.sim.who === rec.i && S.sim.det && S.sim.det.state === 'sensor'))); };
  FX.src.color = () => { const rec = cur(); return rec ? LVC[rec.level] : LVC[0]; };
  FX.src.dust = () => {
    const rec = cur(); if (!rec) return 0;
    let d = rec.env === 'moon' ? 0.18 : 0;
    const m = Math.max(0, ...['sym_olho', 'sym_tosse', 'sym_pele'].map(k => rec.res.inds[k].dev || 0));
    d += Math.min(0.7, m / 2 * 0.7);
    if (rec.evaOn) d += 0.1;
    return Math.min(1, d);
  };
  function applyVars() {
    const rec = cur(); if (!rec) return;
    const bpm = Math.max(30, FX.src.bpm()), fr = rec.res.inds.fr.last || 14;
    document.documentElement.style.setProperty('--beat', (60 / bpm).toFixed(2) + 's');
    document.documentElement.style.setProperty('--breath', (60 / Math.max(6, fr)).toFixed(2) + 's');
  }

  const h0 = location.hash.replace('#', ''); if (TABS.indexOf(h0) >= 0) { S.role = ROLE_TABS.med.indexOf(h0) >= 0 ? 'med' : 'astro'; S.tab = h0; }
  init();
  window.AINH = { S, E, render, init };
})();

</script>
