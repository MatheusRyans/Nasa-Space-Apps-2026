<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* AIneedHealth: operating-console UI. Dark by use scene (dim spacecraft lighting).
   One type family, fixed rem scale, restrained color; status colors carry meaning only. */
:root {
  color-scheme: dark;
  --bg: #0a0f1a;
  --surface: #0f1726;
  --surface-2: #151f33;
  --line: #223049;
  --line-2: #304263;
  --fg: #e7edf7;
  --muted: #a3b0c7;
  --dim: #7f8ea9;
  --accent: #5b9bff;
  --accent-ink: #06142b;
  --accent-weak: #16315b;
  --lv0: #4cc38a;
  --lv1: #e8c547;
  --lv2: #f5902e;
  --lv3: #ff5a4f;
  --lv0-bg: rgba(76, 195, 138, .12);
  --lv1-bg: rgba(232, 197, 71, .12);
  --lv2-bg: rgba(245, 144, 46, .14);
  --lv3-bg: rgba(255, 90, 79, .16);
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --t-xs: .75rem; --t-sm: .8125rem; --t-base: .9375rem; --t-md: 1.0625rem; --t-lg: 1.25rem; --t-xl: 1.5rem; --t-2xl: 1.875rem;
  --r: 6px;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; font: 400 var(--t-base)/1.5 var(--font); color: var(--fg);
  background:
    radial-gradient(1200px 520px at 90% -10%, rgba(45, 100, 220, .18), transparent 62%),
    var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
::selection { background: var(--accent-weak); color: var(--fg); }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
a { color: var(--accent); text-underline-offset: 3px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
input, select { accent-color: var(--accent); caret-color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.lv0 { --c: var(--lv0); --cb: var(--lv0-bg); } .lv1 { --c: var(--lv1); --cb: var(--lv1-bg); }
.lv2 { --c: var(--lv2); --cb: var(--lv2-bg); } .lv3 { --c: var(--lv3); --cb: var(--lv3-bg); }

.wrap { max-width: 1400px; margin: 0 auto; padding-block: 12px 40px; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 4px 0 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { flex: none; }
.brand b { font-size: var(--t-lg); font-weight: 600; letter-spacing: -.01em; }
.brand span { display: block; font-size: var(--t-sm); color: var(--muted); line-height: 1.2; }
.badge-sim { border: 1px solid var(--lv1); color: var(--lv1); background: var(--lv1-bg); padding: 2px 10px; border-radius: 999px; font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
.ctl { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); color: var(--muted); }
.ctl select { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 5px 28px 5px 10px; min-height: 34px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg button { background: var(--surface-2); border: 0; padding: 5px 12px; min-height: 34px; font-size: var(--t-sm); font-weight: 500; color: var(--muted); transition: background .18s var(--ease); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--accent-weak); color: var(--fg); }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; font-weight: 500; color: var(--muted); white-space: nowrap; margin-bottom: -1px; transition: color .18s var(--ease), border-color .18s var(--ease); }
nav.tabs button:hover { color: var(--fg); }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

/* ---------- demo drawer ---------- */
details.demo { border: 1px dashed var(--line-2); border-radius: var(--r); margin-bottom: 14px; background: rgba(21, 31, 51, .5); }
details.demo > summary { padding: 8px 12px; cursor: pointer; font-size: var(--t-sm); font-weight: 600; color: var(--accent); list-style: none; }
details.demo > summary::-webkit-details-marker { display: none; }
details.demo > summary::before { content: '+'; display: inline-block; width: 1.1em; }
details.demo[open] > summary::before { content: '–'; }
.demo-body { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; padding: 0 12px 12px; }
.demo-body p { flex-basis: 100%; margin: 0; font-size: var(--t-sm); color: var(--muted); }
.demo-body .grp { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.demo-body label { display: grid; gap: 4px; font-size: var(--t-xs); color: var(--muted); }

/* ---------- buttons ---------- */
.btn { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 6px 14px; min-height: 36px; font-weight: 500; transition: background .18s var(--ease), border-color .18s var(--ease); }
.btn:hover { border-color: var(--accent); background: var(--accent-weak); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; border-color: var(--line); background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: #7ab0ff; border-color: #7ab0ff; }
.btn.danger { border-color: var(--lv3); color: var(--lv3); }
.btn.danger:hover { background: var(--lv3-bg); }

/* ---------- status pill ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 10px 1px 7px; border: 1px solid var(--c); color: var(--c); background: var(--cb); border-radius: 999px; font-size: var(--t-xs); font-weight: 600; letter-spacing: .03em; white-space: nowrap; line-height: 1.7; }
.pill svg { width: 14px; height: 14px; flex: none; }

/* ---------- alert banner ---------- */
#alertbar { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--c); background: var(--cb); border-radius: var(--r); margin-bottom: 14px; }
#alertbar strong { color: var(--c); font-weight: 600; }
#alertbar .btn { margin-left: auto; border-color: var(--c); }
#alertbar.live { animation: blink 1.2s steps(2, end) infinite; }
@keyframes blink { 50% { background: rgba(255, 90, 79, .3); } }

/* ---------- layout ---------- */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 28px; align-items: start; }
section.pane { min-width: 0; }
.grid .map-pane { order: 1; }
.grid .state-pane { order: 2; }
@media (max-width: 900px) { .grid .map-pane, .grid .state-pane { order: 0; } }
section.pane > h2 { margin: 0 0 4px; font-size: var(--t-md); font-weight: 600; }
.sub { margin: 0 0 12px; color: var(--muted); font-size: var(--t-sm); }
.sep { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 18px; }

/* ---------- state hero ---------- */
.hero { padding: 16px 18px; border: 1px solid var(--c); background: var(--cb); border-radius: var(--r); display: grid; gap: 8px; }
.hero .lvl { display: flex; align-items: center; gap: 12px; font-size: var(--t-2xl); font-weight: 600; letter-spacing: -.01em; color: var(--c); line-height: 1.1; }
.hero .lvl svg { width: 34px; height: 34px; flex: none; }
.hero .msg { font-size: var(--t-md); max-width: 62ch; }
.hero .act { font-weight: 600; }
.hero .meta { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: var(--t-sm); color: var(--muted); }
.note { font-size: var(--t-sm); color: var(--muted); max-width: 70ch; margin: 10px 0 0; }
.note.pending { color: var(--fg); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }

/* questions */
.q { border-top: 1px solid var(--line); }
.q > summary { cursor: pointer; padding: 12px 0; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.q > summary::-webkit-details-marker { display: none; }
.q > summary::after { content: '+'; color: var(--muted); font-weight: 400; }
.q[open] > summary::after { content: '–'; }
.q .body { padding: 0 0 14px; max-width: 70ch; }
.q ul { margin: 0; padding-left: 20px; }
.q li { margin: 3px 0; }
.q p { margin: 0 0 6px; }
.urg { display: inline-block; margin-top: 8px; padding: 1px 10px; border: 1px solid var(--c); color: var(--c); background: var(--cb); border-radius: var(--r); font-size: var(--t-sm); font-weight: 600; }
.disc { font-size: var(--t-sm); color: var(--muted); margin-top: 8px; }
.hz { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: var(--t-xs); color: var(--muted); align-items: center; }
.tag { display: inline-block; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 4px; font-size: var(--t-xs); color: var(--muted); }
.tag.nasa { border-color: var(--accent); color: var(--accent); }

/* tables */
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: var(--t-xs); font-weight: 600; color: var(--dim); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); font-size: var(--t-sm); white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: rgba(91, 155, 255, .06); }
tr.pick.on td { background: var(--accent-weak); }
tr.pick:focus-visible { outline-offset: -2px; }
td.name { white-space: normal; min-width: 150px; }

/* ---------- body map ---------- */
.map { display: block; width: 100%; max-width: 480px; height: auto; margin: 4px auto 6px; }
.reg { cursor: pointer; }
.reg .shape { fill: color-mix(in srgb, var(--c) 16%, var(--surface-2)); stroke: var(--c); stroke-width: 2; transition: fill .2s var(--ease); }
.reg:hover .shape { fill: color-mix(in srgb, var(--c) 28%, var(--surface-2)); }
.reg.sel .shape { stroke-width: 3.5; }
.reg.em .shape { animation: flash 1s steps(2, end) infinite; }
@keyframes flash { 50% { fill: color-mix(in srgb, var(--lv3) 55%, var(--surface-2)); } }
.part { fill: var(--surface-2); stroke: var(--line-2); stroke-width: 1.5; }
.pin rect { fill: var(--surface); stroke: var(--line-2); }
.pin.sel rect { stroke: var(--accent); stroke-width: 2; }
.pin { cursor: pointer; }
.pin .pn { font-size: 11px; fill: var(--muted); font-weight: 600; letter-spacing: .06em; }
.pin .ps { font-size: 12px; font-weight: 600; fill: var(--c); }
.link { stroke: var(--line-2); stroke-width: 1.5; fill: none; }
.whole { display: flex; justify-content: center; margin: 0 0 14px; }
.whole button { display: flex; gap: 10px; align-items: center; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 6px 14px; min-height: 36px; }
.whole button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); }
.region h3 { margin: 0 0 4px; font-size: var(--t-md); font-weight: 600; }
.irow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 96px; gap: 4px 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.irow .nm { font-weight: 500; display: grid; gap: 4px; justify-items: start; }
.irow .v { font-size: var(--t-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.irow .v b { color: var(--fg); font-weight: 500; }
.irow details { grid-column: 1 / -1; }
.irow summary { cursor: pointer; font-size: var(--t-sm); color: var(--muted); }
.irow details p { margin: 6px 0 2px; font-size: var(--t-sm); color: var(--muted); max-width: 70ch; }
svg.sp { display: block; }
.sp-band { fill: rgba(91, 155, 255, .16); } .sp-line { fill: none; stroke: var(--muted); stroke-width: 1.4; } .sp-dot { fill: var(--c); }

/* ---------- charts ---------- */
.chartbox { margin-bottom: 18px; }
.chartbox h3 { margin: 0 0 2px; font-size: var(--t-md); font-weight: 600; }
.ax { fill: var(--dim); font-size: 10.5px; }
.gridl { stroke: var(--line); stroke-width: 1; }
.band { fill: rgba(91, 155, 255, .14); }
.ln { fill: none; stroke: var(--fg); stroke-width: 1.8; stroke-linejoin: round; }

/* ---------- forms ---------- */
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px 20px; }
.form fieldset { grid-column: 1 / -1; border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px 20px; }
.form legend { padding: 0; margin: 0 0 8px; font-weight: 600; font-size: var(--t-md); grid-column: 1 / -1; }
.field { display: grid; gap: 4px; align-content: start; }
.field label { font-weight: 500; font-size: var(--t-sm); }
.field .inp { display: flex; align-items: center; gap: 8px; }
.field input, .field select { width: 100%; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 7px 10px; min-height: 40px; transition: border-color .18s var(--ease); }
.field input:hover, .field select:hover { border-color: var(--dim); }
.field input[aria-invalid="true"] { border-color: var(--lv3); }
.field .u { color: var(--muted); font-size: var(--t-sm); min-width: 3.2em; }
.field .help { font-size: var(--t-xs); color: var(--dim); }
.field .err { font-size: var(--t-xs); color: var(--lv3); min-height: 1em; }
.formfoot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.streak { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; padding: 12px 0; }
.streak .big { font-size: var(--t-xl); font-weight: 600; font-variant-numeric: tabular-nums; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; }
.badges .tag { color: var(--fg); border-color: var(--lv0); }
.result { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--c); background: var(--cb); border-radius: var(--r); display: grid; gap: 6px; }
.op { display: grid; gap: 8px; justify-items: start; }

/* ---------- emergency ---------- */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 12px 0; }
.step { border: 1px solid var(--line-2); border-radius: var(--r); padding: 6px 10px; font-size: var(--t-xs); color: var(--dim); }
.step b { display: block; font-weight: 600; color: var(--muted); }
.step.on { border-color: var(--lv1); color: var(--fg); } .step.on b { color: var(--lv1); }
.step.done { border-color: var(--lv0); } .step.done b { color: var(--lv0); }
.step.crit { border-color: var(--lv3); background: var(--lv3-bg); color: var(--fg); } .step.crit b { color: var(--lv3); }
.countdown { font-size: var(--t-2xl); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--lv1); }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 12px 0; }
dl.kv dt { color: var(--muted); font-size: var(--t-sm); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
dialog.alert { width: min(700px, calc(100vw - 32px)); border: 2px solid var(--lv3); background: #14090c; color: var(--fg); border-radius: 10px; padding: 22px; }
dialog.alert::backdrop { background: rgba(3, 6, 12, .82); }
dialog.alert h2 { margin: 0; font-size: var(--t-2xl); color: var(--lv3); line-height: 1.1; }
dialog.alert ul { margin: 6px 0 14px; padding-left: 20px; }
dialog.alert details { border-top: 1px solid var(--line-2); padding-top: 10px; margin-top: 10px; }
dialog.alert summary { cursor: pointer; color: var(--muted); font-size: var(--t-sm); }

footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: var(--t-sm); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
footer p { margin: 0; flex-basis: 100%; max-width: 90ch; }

@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .irow { grid-template-columns: minmax(0, 1fr) auto; }
  .irow .v, .irow .spk { grid-column: 1; }
  .steps { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .hero .lvl { font-size: var(--t-xl); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .reg.em .shape { animation: none; stroke-width: 5; }
  #alertbar.live { animation: none; }
}

</style>

<script>
/* AIneedHealth engine: pure functions, no DOM, no network.
   Two independent routes feed one state (requirements doc, section 3):
   route A = trend against the individual baseline (persistence + hysteresis),
   route B = absolute safety limits (immediate, confirmed by 2 consecutive readings).
   Every number below is a parameter of the Medical Profile, set by the flight medical team. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* Levels: 0 good, 1 alert, 2 attention, 3 critical emergency */
  const LEVEL_KEYS = ['good', 'alert', 'attention', 'emergency'];

  /* dir = direction of risk; kind: num (deviation in sigma) | ord (deviation in points) */
  const INDICATORS = [
    { k: 'fc', dir: 'up', kind: 'num', dec: 0, unit: 'bpm', region: 'chest', min: 30, max: 200, step: 1, hz: ['gravity', 'isolation'] },
    { k: 'spo2', dir: 'down', kind: 'num', dec: 0, unit: '%', region: 'chest', min: 70, max: 100, step: 1, hz: ['closedEnv'] },
    { k: 'fr', dir: 'both', kind: 'num', dec: 0, unit: 'rpm', region: 'chest', min: 4, max: 40, step: 1, hz: ['closedEnv', 'gravity'] },
    { k: 'pa', dir: 'both', kind: 'num', dec: 0, unit: 'mmHg', region: 'chest', min: 60, max: 220, step: 1, hz: ['gravity'] },
    { k: 'sym_tosse', dir: 'up', kind: 'ord', dec: 1, unit: '/3', region: 'chest', min: 0, max: 3, step: 1, hz: ['closedEnv'] },
    { k: 'sono', dir: 'down', kind: 'num', dec: 1, unit: 'h', region: 'head', min: 0, max: 14, step: 0.1, hz: ['isolation', 'closedEnv'] },
    { k: 'humor', dir: 'down', kind: 'ord', dec: 1, unit: '/5', region: 'head', min: 1, max: 5, step: 1, hz: ['isolation', 'distance'] },
    { k: 'sym_olho', dir: 'up', kind: 'ord', dec: 1, unit: '/3', region: 'head', min: 0, max: 3, step: 1, hz: ['closedEnv'] },
    { k: 'temp', dir: 'up', kind: 'num', dec: 1, unit: '°C', region: 'arms', min: 34, max: 42, step: 0.1, hz: ['gravity', 'closedEnv'] },
    { k: 'sym_pele', dir: 'up', kind: 'ord', dec: 1, unit: '/3', region: 'arms', min: 0, max: 3, step: 1, hz: ['closedEnv'] },
    { k: 'gli', dir: 'both', kind: 'num', dec: 0, unit: 'mg/dL', region: 'general', min: 30, max: 500, step: 1, hz: [] }
  ];
  const IK = Object.fromEntries(INDICATORS.map(i => [i.k, i]));

  /* Route B: absolute limits [limit 1 -> attention, limit 2 -> critical emergency] */
  const LIMITS = {
    temp: { high: [38.4, 39.5], hiOp: 'ge' },
    spo2: { low: [90, 85] },
    fc: { high: [100, 130], hiOp: 'gt', low: [45, 35] },
    pa: { high: [160, 180], hiOp: 'ge', low: [90, 70] },
    gli: { high: [180, 300], hiOp: 'gt', low: [70, 54] }
  };

  /* Long-term capacity: requirements of NASA-STD-3001 Vol. 1 Rev C, shown as a separate seal */
  const CAPACITY = [
    { k: 'aer', ref: 'V1 4003', req: 80 },

      if (res.watch.length) what.push(res.watch.map(k => t('ind.' + k + '.s') + ' ' + sgn(res.inds[k].dev) + (E.IK[k].kind === 'ord' ? '' : 'σ')).join(', '));
      why = t('q.none.2'); ifnot = t('q.none.4'); acts = [t('q.none.5a'), t('q.none.5b')]; urg = t('q.urg.0');
    } else {
      lims.forEach(l => { const I = E.IK[l.k]; what.push(t('ind.' + l.k) + ': ' + fmt(l.value, I.dec) + un(I.unit) + ' (' + limitText(l.k) + ') — ' + (l.confirmed ? t('q.limit.conf') : t('q.limit.prov'))); });
      dev.slice(0, 5).forEach(I => { const d = res.inds[I.k]; what.push(t('ind.' + I.k) + ': ' + fmt(d.cur, I.dec) + un(I.unit) + ' · ' + t('region.base') + ' ' + fmt(d.baseline.mean, I.dec) + ' (' + sgn(d.dev) + (I.kind === 'ord' ? '' : 'σ') + ', ' + d.persist + ' d)'); });
      if (res.source === 'B') {
        const w = worstLimit(res);
        why = t('q.limit.2'); ifnot = t('q.limit.4');
        const crit = lv === 3;
        acts = crit ? [t('q.limit.crit.5a'), t('q.limit.crit.5b')] : [t('q.limit.5a'), t('q.limit.5b')];
        urg = crit ? t('q.limit.crit.urg') : t('q.limit.urg');
        if (w) E.IK[w.k].hz.forEach(h => hz.push(h));
      } else if (p) {
        why = t('pat.' + p.id + '.hyp'); ifnot = t('pat.' + p.id + '.ifnot');
        acts = t('pat.' + p.id + (lv === 1 ? '.a1' : '.a2')); urg = t('pat.' + p.id + (lv === 1 ? '.u1' : '.u2'));
        p.hz.forEach(h => hz.push(h));
        if (p.id === 'dust' && rec.evaDay != null) what.push(t('pat.dust.note', { eva: rec.evaDay }));
        res.pats.filter(q => q !== p).forEach(q => what.push(t('pat.' + q.id + '.name')));
      } else {
        why = t('q.single.2'); ifnot = t('q.single.4'); acts = [t('q.single.5a'), t('q.single.5b')]; urg = t('lv.act.2');
      }
    }
    const rows = [];
    lims.forEach(l => { const I = E.IK[l.k]; rows.push('<tr class="lv' + (l.confirmed && l.level === 2 ? 3 : 2) + '"><td class="name">' + esc(t('ind.' + l.k + '.s')) + '</td><td>' + esc(limitText(l.k)) + '</td><td>' + fmt(l.value, I.dec) + esc(un(I.unit)) + '</td><td>—</td><td>' + (l.confirmed ? 2 : 1) + '×</td><td>' + pill(l.confirmed && l.level === 2 ? 3 : 2) + '</td></tr>'); });
    (dev.length ? dev : E.INDICATORS.slice().sort((a, b) => res.inds[b.k].bad - res.inds[a.k].bad).slice(0, 3)).slice(0, 5).forEach(I => {
      const d = res.inds[I.k];
      rows.push('<tr><td class="name">' + esc(t('ind.' + I.k + '.s')) + '</td><td>' + fmt(d.baseline.mean, I.dec) + ' ± ' + fmt(d.baseline.sd, I.dec) + '</td><td>' + (d.cur == null ? '—' : fmt(d.cur, I.dec) + esc(un(I.unit))) + '</td><td>' + (d.dev == null ? '—' : sgn(d.dev) + (I.kind === 'ord' ? '' : 'σ')) + '</td><td>' + (d.persist || '—') + '</td><td>' + pill(d.level) + '</td></tr>');
    });
    return { what, why, ifnot, acts, urg, hz, p, rows };
  }

  function irow(I, rec) {

  /* ---------- overview ---------- */

    else if (rec.em && rec.em.stage === 'confirm') msg = '<h3>' + esc(t('em.confirm')) + '</h3><p>' + esc(t('em.confirm.desc', { n: rec.em.cd })) + '</p><p><span class="countdown">' + rec.em.cd + '</span></p><p><button class="btn primary" data-act="ack">' + esc(t('em.respond')) + '</button></p>';
    else if (st === 'sensor') msg = '<h3>' + esc(t('em.sensor')) + '</h3><p>' + esc(t('em.sensor.desc')) + '</p>';
    else if (st === 'sleep') msg = '<h3>' + esc(t('em.sleep')) + '</h3><p>' + esc(t('em.sleep.desc')) + '</p>';
    return '<div class="result lv' + (rec.em ? 1 : 0) + '" role="status">' + msg + '<div>' + emChart(sim.buf, rec.profile.limits.fc.low[1]) + '</div><p class="note" style="margin-top:0">' + esc(t('em.note')) + '</p></div>';

  function gateHtml(rec) {

  function renderOverview(rec) {

      ['3', '<div class="tscroll"><table><thead><tr><th>' + esc(t('q.ev.ind')) + '</th><th>' + esc(t('q.ev.base')) + '</th><th>' + esc(t('q.ev.now')) + '</th><th>' + esc(t('q.ev.dev')) + '</th><th>' + esc(t('q.ev.days')) + '</th><th>' + esc(t('q.ev.lv')) + '</th></tr></thead><tbody>' + ex.rows.join('') + '</tbody></table></div><p class="disc">' + esc(t('q.ev.note')) + '</p>', false],
      ['4', '<p>' + esc(ex.ifnot) + '</p>', false],

    state += '<div class="sep" style="margin-top:18px;padding-top:0;border-top:0">' + qs.map(q => '<details class="q"' + (q[2] ? ' open' : '') + '><summary>' + esc(t('q.' + q[0])) + '</summary><div class="body">' + q[1] + '</div></details>').join('') + '</div>';

  /* ---------- check-in ---------- */

  }

  function renderCheckin(rec) {
    const meas = ['fc', 'spo2', 'fr', 'pa', 'temp', 'gli', 'sono'].map(k => E.IK[k]), feel = ['humor', 'sym_olho', 'sym_tosse', 'sym_pele'].map(k => E.IK[k]);

      '<form class="form" id="ciform" novalidate><fieldset><legend>' + esc(t('ci.measure')) + '</legend>' + meas.map(fieldHtml).join('') + '</fieldset><fieldset><legend>' + esc(t('ci.feel')) + '</legend>' + feel.map(fieldHtml).join('') + '</fieldset><div class="formfoot"><button type="submit" class="btn primary">' + esc(t('ci.submit')) + '</button><span class="err" id="ci-err" role="alert">' + (S.errors._empty ? esc(t('ci.err.empty')) : '') + '</span></div></form>' +

  }

  /* ---------- history ---------- */
  function renderHistory(rec) {
    const I = E.IK[S.ind] || E.INDICATORS[0], d = rec.res.inds[I.k];
    const rows = E.INDICATORS.map(i => {
      const q = rec.res.inds[i.k];
      return '<tr class="pick' + (i.k === I.k ? ' on' : '') + ' lv' + q.level + '" data-act="ind" data-k="' + i.k + '" tabindex="0"><td class="name">' + esc(t('ind.' + i.k + '.s')) + '</td><td>' + fmt(q.baseline.mean, i.dec) + ' ± ' + fmt(q.baseline.sd, i.dec) + '</td><td>' + (q.cur == null ? '—' : fmt(q.cur, i.dec) + esc(un(i.unit))) + '</td><td>' + (q.dev == null ? '—' : sgn(q.dev) + (i.kind === 'ord' ? '' : 'σ')) + '</td><td>' + (q.persist || '—') + '</td><td>' + pill(q.level) + '</td><td>' + spark(q.series, q.baseline, q.level) + '</td></tr>';
    }).join('');
    const evs = S.events.filter(e => e.who === rec.i || e.pub).sort((a, b) => b.m - a.m || b.id - a.id).slice(0, 14);
    return '<div class="grid"><section class="pane"><h2>' + esc(t('hist.title')) + ' · ' + esc(rec.name) + '</h2><div class="ctl" style="margin:8px 0 12px"><label for="indsel">' + esc(t('hist.indicator')) + '</label><select id="indsel" data-act-change="ind">' + E.INDICATORS.map(i => '<option value="' + i.k + '"' + (i.k === I.k ? ' selected' : '') + '>' + esc(t('ind.' + i.k)) + '</option>').join('') + '</select></div><div class="chartbox lv' + d.level + '"><h3>' + esc(t('ind.' + I.k)) + '</h3><p class="sub">' + esc(t('hist.sub')) + '</p>' + bigChart(I, rec) + '</div><div class="tscroll"><table><thead><tr><th>' + esc(t('hist.indicator')) + '</th><th>' + esc(t('hist.col.base')) + '</th><th>' + esc(t('hist.col.now')) + '</th><th>' + esc(t('hist.col.dev')) + '</th><th>' + esc(t('hist.col.days')) + '</th><th>' + esc(t('hist.col.lv')) + '</th><th>' + esc(t('hist.col.trend')) + '</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>' +
      '<section class="pane"><h2>' + esc(t('hist.events')) + '</h2>' + (evs.length ? '<div class="tscroll"><table><tbody>' + evs.map(e => '<tr class="lv' + e.lv + '"><td>' + esc(tstr(e.m)) + '</td><td class="name">' + esc(evText(e)) + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="sub">' + esc(t('hist.none')) + '</p>') + '<div class="sep"><h2>' + esc(t('cap.title')) + '</h2><div class="tscroll"><table><tbody>' + capRows(rec) + '</tbody></table></div></div></section></div>';
  }

  /* ---------- profile ---------- */
  function renderProfile(rec) {
    const p = rec.profile, tol = p.tolerances;
    const base = E.INDICATORS.map(i => {
      const b = p.baseline[i.k], L = p.limits[i.k];
      const l1 = L ? [L.high ? t('prof.high') + ' ' + (L.hiOp === 'ge' ? '≥ ' : '> ') + L.high[0] : '', L.low ? t('prof.low') + ' < ' + L.low[0] : ''].filter(Boolean).join(' · ') : '—';
      const l2 = L ? [L.high ? t('prof.high') + ' ' + (L.hiOp === 'ge' ? '≥ ' : '> ') + L.high[1] : '', L.low ? t('prof.low') + ' < ' + L.low[1] : ''].filter(Boolean).join(' · ') : '—';
      return '<tr><td class="name">' + esc(t('ind.' + i.k)) + '</td><td>' + fmt(b.mean, i.dec) + esc(un(i.unit)) + '</td><td>' + fmt(b.sd, i.dec) + '</td><td>' + esc(l1) + '</td><td>' + esc(l2) + '</td></tr>';
    }).join('');
    return '<section class="pane" style="max-width:1000px"><h2>' + esc(t('prof.title')) + ' · ' + esc(rec.name) + '</h2><p class="sub">' + esc(t('prof.intro')) + '</p><dl class="kv"><dt>' + esc(t('prof.version')) + '</dt><dd>' + p.version + '</dd><dt>' + esc(t('prof.by')) + '</dt><dd>' + esc(p.approvedBy) + '</dd><dt>' + esc(t('prof.at')) + '</dt><dd>' + p.approvedAt + '</dd><dt>' + esc(t('prof.env')) + '</dt><dd>' + esc(t('env.' + rec.env)) + '</dd><dt>' + esc(t('prof.adapt')) + '</dt><dd>' + esc(t('prof.adapt.val', { n: tol.adaptationDays })) + '</dd></dl>' +
      '<div class="tscroll"><table><thead><tr><th>' + esc(t('prof.col.ind')) + '</th><th>' + esc(t('prof.col.mean')) + '</th><th>' + esc(t('prof.col.sd')) + '</th><th>' + esc(t('prof.col.l1')) + '</th><th>' + esc(t('prof.col.l2')) + '</th></tr></thead><tbody>' + base + '</tbody></table></div>' +
      '<div class="sep"><h2 style="margin:0 0 8px;font-size:var(--t-md)">' + esc(t('prof.tol')) + '</h2><dl class="kv"><dt>' + esc(t('prof.tol.alert')) + '</dt><dd>' + esc(t('prof.tol.enter')) + ' ≥ ' + tol.alertSigma + 'σ ' + esc(t('prof.tol.exitAfter')) + ' ' + esc(t('prof.tol.days', { n: tol.enterDays })) + ' · ' + esc(t('prof.tol.exit')) + ' ' + tol.exitAlertSigma + 'σ ' + esc(t('prof.tol.exitAfter')) + ' ' + esc(t('prof.tol.days', { n: tol.exitDays })) + '</dd><dt>' + esc(t('prof.tol.attn')) + '</dt><dd>' + esc(t('prof.tol.enter')) + ' ≥ ' + tol.attnSigma + 'σ ' + esc(t('prof.tol.exitAfter')) + ' ' + esc(t('prof.tol.days', { n: tol.enterDays })) + ' · ' + esc(t('prof.tol.exit')) + ' ' + tol.exitAttnSigma + 'σ ' + esc(t('prof.tol.exitAfter')) + ' ' + esc(t('prof.tol.days', { n: tol.exitDays })) + '</dd><dt>' + esc(t('prof.tol.dwell')) + '</dt><dd>' + esc(t('prof.tol.hours', { n: tol.minDwellHours })) + '</dd></dl><p class="note">' + esc(t('prof.note')) + '</p></div></section>';
  }

  /* ---------- shell ---------- */
  function renderTop() {
    $('#viewas').innerHTML = ROSTER.map((r, i) => '<option value="' + i + '"' + (i === S.user ? ' selected' : '') + '>' + esc(r.name) + '</option>').join('');
    $('#lbl-view').textContent = t('view.as');
    $('#lbl-lang').textContent = t('lang.label');
    $('#sub').textContent = t('app.sub');
    $('#sim').textContent = t('badge.sim');
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
    document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    $('#tabs').innerHTML = TABS.map(k => '<button role="tab" id="tab-' + k + '" aria-selected="' + (S.tab === k) + '" data-act="tab" data-tab="' + k + '">' + esc(t('nav.' + k)) + '</button>').join('');
    $('#foot').innerHTML = '<p>' + esc(t('foot.disc')) + '</p><span>' + esc(t('foot.sources')) + ':</span><a href="https://standards.nasa.gov/standard/nasa/nasa-std-3001" target="_blank" rel="noopener">NASA-STD-3001</a><a href="https://www.nasa.gov/hrp/hazards/" target="_blank" rel="noopener">NASA HRP</a><a href="https://www.asc-csa.gc.ca/eng/sciences/bio-monitor.asp" target="_blank" rel="noopener">CSA Bio-Monitor</a><a href="https://www.nasa.gov/directorates/esdmd/hhp/risk-of-adverse-health-performance-effects-of-celestial-dust-exposure/" target="_blank" rel="noopener">NASA dust risk</a>';
  }
  function renderDemo() {
    const open = S.demoOpen ? ' open' : '';
    $('#demo').innerHTML = '<details class="demo"' + open + ' id="demod"><summary>' + esc(t('demo.title')) + '</summary><div class="demo-body"><p>' + esc(t('demo.note')) + '</p><div class="grp"><label>' + esc(t('demo.scenario')) + '<select id="scnsel">' + ['healthy', 'trend', 'high', 'dust', 'acute'].map(s => '<option value="' + s + '">' + esc(t('demo.sc.' + s)) + '</option>').join('') + '</select></label><button class="btn" data-act="scn">' + esc(t('demo.apply')) + '</button></div><div class="grp"><button class="btn" data-act="nextday">' + esc(t('demo.nextday')) + '</button></div><div class="grp"><button class="btn danger" data-act="sim" data-mode="faint">' + esc(t('demo.faint')) + '</button><button class="btn" data-act="sim" data-mode="sleep">' + esc(t('demo.sleep')) + '</button><button class="btn" data-act="sim" data-mode="sensor">' + esc(t('demo.sensor')) + '</button></div><div class="grp"><button class="btn" data-act="reset">' + esc(t('demo.reset')) + '</button></div></div></details>';
    const d = $('#demod'); if (d) d.addEventListener('toggle', () => { S.demoOpen = d.open; });
  }
  function renderBanner() {
    const b = $('#alertbar');
    const decl = S.recs.find(r => r.em && r.em.stage === 'declared');
    const me = cur();
    b.className = ''; b.hidden = true; b.innerHTML = '';
    if (decl) {
      b.hidden = false; b.className = 'lv3 live'; b.setAttribute('role', 'alert');
      b.innerHTML = '<strong>' + esc(t('em.banner', { name: decl.name, time: tstr(decl.em.t0) })) + '</strong><button class="btn" data-act="alertopen">' + esc(t('em.view')) + '</button>';
    } else if (me.em && (me.em.stage === 'suspect' || me.em.stage === 'confirm')) {
      b.hidden = false; b.className = 'lv1'; b.setAttribute('role', 'status');
      b.innerHTML = '<strong>' + esc(t('em.banner.suspect', { name: me.name, sec: me.em.stage === 'confirm' ? me.em.cd + ' s' : '…' })) + '</strong>';
    } else if (me.loss) {
      b.hidden = false; b.className = 'lv0'; b.setAttribute('role', 'status');
      b.innerHTML = '<strong style="color:var(--muted)">' + esc(t('em.sensor')) + '</strong><span>' + esc(t('em.sensor.desc')) + '</span>';
    }
  }
  function render() {
    renderTop(); renderBanner();
    const rec = cur(), m = $('#main');
    m.setAttribute('role', 'tabpanel'); m.setAttribute('aria-labelledby', 'tab-' + S.tab);
    m.innerHTML = S.tab === 'overview' ? renderOverview(rec) : S.tab === 'checkin' ? renderCheckin(rec) : S.tab === 'history' ? renderHistory(rec) : renderProfile(rec);
  }

  /* ---------- crew alert dialog ---------- */
  function openAlert() {
    const rec = S.recs.find(r => r.em && r.em.stage === 'declared');
    if (!rec) return;
    const res = rec.res, dev = E.INDICATORS.filter(i => res.inds[i.k].level >= 1).sort((a, b) => res.inds[b.k].bad - res.inds[a.k].bad);
    const trend = dev.slice(0, 3).map(i => t('ind.' + i.k + '.s') + ' ' + sgn(res.inds[i.k].dev) + (i.kind === 'ord' ? '' : 'σ')).join(' · ') || '—';
    const hr = Math.round(rec.em.hrLast);
    const dlg = $('#crew');
    dlg.innerHTML = '<h2 id="crew-title">' + esc(t('em.declared')) + '</h2><p class="muted" style="margin:6px 0 0">' + esc(t('em.alert.title')) + '</p><dl class="kv"><dt>' + esc(t('em.f.name')) + '</dt><dd><b>' + esc(rec.name) + '</b> (' + rec.id + ')</dd><dt>' + esc(t('em.f.time')) + '</dt><dd>' + esc(tstr(rec.em.t0)) + '</dd><dt>' + esc(t('em.f.status')) + '</dt><dd>' + esc(t('lv.3')) + ' · ' + esc(t('em.p1')) + '</dd><dt>' + esc(t('em.f.critical')) + '</dt><dd>' + esc(t('em.crit.val', { hr })) + '</dd><dt>' + esc(t('em.f.trend')) + '</dt><dd>' + esc(trend) + '</dd></dl><b>' + esc(t('em.f.actions')) + '</b><ul>' + t('em.actions').map(a => '<li>' + esc(a) + '</li>').join('') + '</ul><details><summary>' + esc(t('em.ground')) + '</summary><dl class="kv"><dt>' + esc(t('em.g.id')) + '</dt><dd>' + rec.id + ' · ' + esc(rec.name) + '</dd><dt>' + esc(t('em.g.signs')) + '</dt><dd>' + esc(t('em.crit.val', { hr })) + '</dd><dt>' + esc(t('em.g.hist')) + '</dt><dd>' + esc(t('em.g.histv')) + '</dd><dt>' + esc(t('em.g.evo')) + '</dt><dd>' + esc(t('em.g.evov')) + '</dd><dt>' + esc(t('em.g.state')) + '</dt><dd>' + esc(t('lv.3')) + '</dd><dt>' + esc(t('em.g.why')) + '</dt><dd>' + esc(t('em.g.whyv')) + '</dd><dt>' + esc(t('em.g.risk')) + '</dt><dd>' + esc(trend) + '</dd></dl><p class="muted">' + esc(t('em.g.queue')) + '</p></details><p class="muted" style="font-size:var(--t-sm)">' + esc(t('em.privacy')) + ' ' + esc(t('em.note')) + '</p><p><button class="btn primary" data-act="alertclose" id="crew-close">' + esc(t('em.close')) + '</button></p>';
    if (!dlg.open && dlg.showModal) { try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); } }
    const c = $('#crew-close'); if (c) c.focus();
  }
  function closeAlert() { const d = $('#crew'); if (d.open && d.close) d.close(); else d.removeAttribute('open'); }

  /* ---------- simulation of the incapacitation stream ---------- */
  function stopSim() { if (S.sim) { clearInterval(S.sim.timer); clearInterval(S.sim.cdTimer); S.sim = null; } S.recs.forEach(r => { r.sleeping = false; }); }
  function startSim(mode) {
    stopSim();
    const rec = cur(); rec.em = null; rec.loss = false;
    const r = E.rng(7);
    S.sim = { mode, who: rec.i, t: 0, buf: [], det: { state: 'ok' }, r, timer: null, cdTimer: null, holdSuspect: 0 };
    rec.sleeping = mode === 'sleep';
    S.sim.timer = setInterval(tick, 120);
    S.tab = 'overview'; recompute(rec); render();
  }
  function tick() {
    const sim = S.sim; if (!sim) return;
    const rec = S.recs[sim.who];
    const sample = E.simulateSample(sim.mode, sim.t++, sim.r);
    sim.buf.push(sample); if (sim.buf.length > 300) sim.buf.shift();
    sim.det = E.detectIncapacitation(sim.buf, { limits: rec.profile.limits, sleeping: rec.sleeping });
    const wasLoss = rec.loss;
    rec.loss = sim.det.state === 'sensor';
    if (rec.loss && !wasLoss) addEv(rec.i, 0, 'evt.sensor');
    if (!rec.loss && wasLoss) addEv(rec.i, 0, 'evt.sensorBack');
    if (!rec.em && sim.det.state === 'suspect') {
      rec.em = { stage: 'suspect', cd: 8, buf: [], t0: S.clock, hrLast: sample.hr };
      addEv(rec.i, 1, 'evt.suspect');
      sim.holdSuspect = sim.t;
    } else if (rec.em && rec.em.stage === 'suspect' && sim.t - sim.holdSuspect > 10) {
      rec.em.stage = 'confirm';
      sim.cdTimer = setInterval(countdown, 1000);
    }
    if (rec.em) rec.em.hrLast = sample.hr != null ? sample.hr : rec.em.hrLast;
    if (S.user === rec.i && S.tab === 'overview' && (!rec.em || rec.em.stage !== 'confirm')) { render(); }
    else if (S.user === rec.i && S.tab === 'overview' && rec.em && rec.em.stage === 'confirm') { /* the countdown redraws */ }
    if (sim.mode === 'faint' && !rec.em && sim.t > 130) { clearInterval(sim.timer); }
  }
  function countdown() {
    const sim = S.sim; if (!sim) return;
    const rec = S.recs[sim.who];
    if (!rec.em || rec.em.stage !== 'confirm') { clearInterval(sim.cdTimer); return; }
    rec.em.cd--;
    if (rec.em.cd <= 0) { clearInterval(sim.cdTimer); clearInterval(sim.timer); declare(rec); }
    else render();
  }
  function declare(rec) {
    S.clock += 4;
    rec.em.stage = 'declared'; rec.em.t0 = S.clock; rec.em.buf = S.sim ? S.sim.buf.slice(-100) : [];
    addEv(rec.i, 3, 'evt.em', {}, true); addEv(rec.i, 3, 'evt.alert', {}, true);
    recompute(rec);
    S.user = (rec.i + 1) % ROSTER.length; S.tab = 'overview';
    render(); openAlert();
  }
  function ackSim() {
    const rec = cur(), sim = S.sim;
    if (!rec.em || rec.em.stage === 'declared') return;
    clearInterval(sim && sim.cdTimer);
    rec.em = null; addEv(rec.i, 0, 'evt.ok');
    if (sim) { clearInterval(sim.timer); S.sim = null; }
    recompute(rec); render();
  }

  /* ---------- actions ---------- */
  function submitCheckin() {
    const rec = cur(), v = Object.assign({}, S.form);
    S.errors = E.validate(v);
    const any = E.INDICATORS.some(i => v[i.k] !== '' && v[i.k] != null);
    if (!any) S.errors._empty = true;
    if (Object.keys(S.errors).length) { render(); const first = document.querySelector('[aria-invalid="true"]'); if (first) first.focus(); return; }
    const prev = snap(rec);
    E.addReading(rec, rec.today, v, rec.today * 1440 + (S.clock % 1440));
    rec.fresh = true;
    S.clock += 7;
    addEv(rec.i, 0, 'evt.checkin', { day: rec.today });
    recompute(rec); logChange(rec, prev);
    S.form = {}; S.errors = {}; S.result = { who: rec.i };
    render();
    const r = $('#ci-result'); if (r) r.focus();
    live(t('ci.saved') + ' ' + t('lv.' + rec.level));
  }
  function live(text) { const l = $('#live'); if (l) l.textContent = text; }
  function loadScenario() {
    const sc = $('#scnsel').value, i = S.user;
    stopSim();
    const prevLevel = S.recs[i].level;
    const rec = mkRec(i, sc); S.recs[i] = rec;
    S.clock += 11; addEv(i, rec.level, 'evt.scenario', { scenario: sc });
    if (rec.level !== prevLevel) addEv(i, rec.level, 'evt.state', { from: prevLevel, to: rec.level });
    rec.res.pats.forEach(p => addEv(i, p.level, 'evt.pattern', { pattern: p.id, conf: p.conf }));
    Object.keys(rec.res.limits).forEach(k => addEv(i, 2, 'evt.limit', { ind: k }));
    S.result = null; S.form = {}; S.errors = {};
    closeAlert(); render();
  }
  function nextDay() {
    const rec = cur();
    if (rec.em && rec.em.stage === 'declared') return;
    rec.today++; rec.fresh = false; S.clock = rec.today * 1440 + 480;
    addEv(rec.i, 0, 'evt.day', { day: rec.today });
    S.result = null; recompute(rec); render();
  }
  function init() {
    stopSim();
    S.recs = ROSTER.map((r, i) => mkRec(i, r.scn));
    S.events = []; S.eid = 0; S.clock = 30 * 1440 + 480; S.user = 1; S.tab = 'overview'; S.region = 'chest'; S.result = null; S.form = {}; S.errors = {}; S.gateMsg = null;
    S.recs.forEach(rec => { rec.res.pats.forEach(p => addEv(rec.i, p.level, 'evt.pattern', { pattern: p.id, conf: p.conf })); });
    closeAlert(); renderDemo(); render();
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act;
    if (a === 'tab') { S.tab = el.dataset.tab; S.gateMsg = null; if (location.hash !== '#' + S.tab) { try { history.replaceState(null, '', '#' + S.tab); } catch (x) { /* ignore */ } } render(); window.scrollTo(0, 0); }
    else if (a === 'region') { S.region = el.dataset.r; render(); }
    else if (a === 'ind') { S.ind = el.dataset.k; render(); }
    else if (a === 'scn') loadScenario();
    else if (a === 'nextday') nextDay();
    else if (a === 'reset') init();
    else if (a === 'sim') startSim(el.dataset.mode);
    else if (a === 'ack') ackSim();
    else if (a === 'alertopen') openAlert();
    else if (a === 'alertclose') closeAlert();
    else if (a === 'endinc') { const rec = S.recs.find(r => r.em && r.em.stage === 'declared'); if (rec) { addEv(rec.i, 0, 'evt.end', {}, true); rec.em = null; stopSim(); recompute(rec); closeAlert(); render(); } }
    else if (a === 'evastart') { const rec = cur(); if (!rec.fresh) { S.gateMsg = true; render(); return; } rec.evaOn = true; rec.evaDay = rec.today; rec.fresh = false; S.gateMsg = null; addEv(rec.i, 0, 'evt.eva'); recompute(rec); render(); }
    else if (a === 'evaend') { const rec = cur(); rec.evaOn = false; addEv(rec.i, 0, 'evt.evaEnd'); render(); }
    else if (a === 'lang') { lang = el.dataset.lang; try { localStorage.setItem('ainh-lang', lang); } catch (x) { /* ignore */ } renderDemo(); render(); }
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-act][tabindex]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'viewas') { stopSim(); S.user = +el.value; S.result = null; S.form = {}; S.errors = {}; S.gateMsg = null; render(); }
    else if (el.dataset && el.dataset.bind) { S.form[el.dataset.bind] = el.value; }
    else if (el.id === 'indsel') { S.ind = el.value; render(); }
  });
  document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.bind) S.form[el.dataset.bind] = el.value; });
  document.addEventListener('submit', e => { if (e.target.id === 'ciform') { e.preventDefault(); submitCheckin(); } });
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (TABS.indexOf(h) >= 0 && h !== S.tab) { S.tab = h; render(); } });

  const h0 = location.hash.replace('#', ''); if (TABS.indexOf(h0) >= 0) S.tab = h0;
  init();
  window.AINH = { S, E, render, init };
})();

</script>
